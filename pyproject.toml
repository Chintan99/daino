[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vasuki"
version = "0.3.2"
description = "A local-first, provider-independent autonomous software engineering agent"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Vasuki Contributors"}]
dependencies = [
  "alembic>=1.14",
  "asyncssh>=2.20",
  "httpx>=0.28",
  "pip-audit>=2.10",
  "prompt-toolkit>=3.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "rich>=13.9",
  "sqlalchemy>=2.0",
  "textual>=6.1,<7",
  "tree-sitter>=0.24",
  "tree-sitter-language-pack>=0.7",
  "tree-sitter-typescript>=0.23",
  "typer>=0.15",
]

[project.optional-dependencies]
indexing = []
browser = ["playwright>=1.49"]
keyring = ["keyring>=25.5"]
otel = [
  "opentelemetry-api>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
  "opentelemetry-sdk>=1.29",
]
dev = [
  "bandit>=1.8",
  "coverage>=7.6",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
]

[project.scripts]
vasuki = "vasuki.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["vasuki"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".tooling"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S105", "S603", "S607", "ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["vasuki"]
branch = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404"]
