[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "daino"
version = "0.4.0"
description = "A local-first, provider-independent autonomous software engineering agent with a TUI and browser IDE"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Daino Contributors"}]
dependencies = [
  "alembic>=1.14",
  "asyncssh>=2.20",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pip-audit>=2.10",
  "prompt-toolkit>=3.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "rich>=13.9",
  "sqlalchemy>=2.0",
  "textual>=6.1,<7",
  "tree-sitter>=0.24",
  "tree-sitter-language-pack>=0.7",
  "typer>=0.15",
  "uvicorn[standard]>=0.32",
  "websockets>=13.1",
]

[project.optional-dependencies]
indexing = []
browser = ["playwright>=1.49"]
# Readers for the document formats a Workspace accepts as uploads. Kept
# optional so the base install stays lean for repository work.
documents = [
  "openpyxl>=3.1",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
]
keyring = ["keyring>=25.5"]
otel = [
  "opentelemetry-api>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
  "opentelemetry-sdk>=1.29",
]
dev = [
  "bandit>=1.8",
  "coverage>=7.6",
  # The debugger tests drive a real DAP session rather than a mock, because the
  # things that break in a debug client are protocol details a fake adapter
  # would agree with. Without this they skip.
  "debugpy>=1.8",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
]

[project.scripts]
daino = "daino.cli.app:run_cli"
vasuki = "daino.cli.app:legacy_main"

[tool.hatch.build.targets.wheel]
packages = ["daino", "vasuki"]

# The GUI serves this markdown at /docs, so it has to travel with the package.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "daino/_docs"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".tooling"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S105", "S603", "S607", "ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["daino"]
branch = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404"]
