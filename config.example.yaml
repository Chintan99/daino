project:
  name: example
  default_mode: specification
  context_budget_tokens: 24000
database:
  url: sqlite:///.daino/daino.db
runtime:
  default: docker
  network_access: restricted
  command_timeout_seconds: 600
  # Non-slim: it includes Git, which the fallback verification command needs.
  docker_image: python:3.12
verification:
  repair_attempts_local: 2
  total_attempts: 4
  require_review: true
git:
  use_worktrees: true
  auto_commit_verified_tasks: true
  auto_push: false
security:
  require_approval_for_install: true
  require_approval_for_network: true
  require_approval_for_production: true
memory:
  enabled: true
  auto_save: true
  auto_extract: true
  auto_resume: false
  max_retrieved_items: 8
  max_context_tokens: 2000
  compaction_threshold: 0.8
  embedding_provider: disabled
  embedding_model: ""
  embedding_base_url: ""
  embedding_api_key: "" # secret reference only, e.g. env://EMBEDDING_API_KEY
  decay_enabled: true
  decay_half_life_days: 180
  user_memory_enabled: true
  failure_memory_enabled: true
providers:
  openrouter:
    type: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key: env://OPENROUTER_API_KEY
    model: anthropic/claude-sonnet-4
  local-ollama:
    type: ollama
    base_url: http://127.0.0.1:11434/v1
    model: qwen2.5-coder:7b
    timeout: 300
    # Ollama defaults to [chat, structured, tools].
  local:
    type: vllm
    base_url: http://127.0.0.1:8000/v1
    api_key: env://VLLM_API_KEY
    model: local-coder
    # Add tools when vLLM is served with --enable-auto-tool-choice
    # --tool-call-parser <parser>:
    # features: [chat, structured, tools]
models:
  strong-cloud:
    provider: openrouter
    model: anthropic/claude-sonnet-4
    planning_score: 9
    coding_score: 9
  local-ollama:
    provider: local-ollama
    model: qwen2.5-coder:7b
    local: true
    coding_score: 8
    # Auto also selects compact mode for constrained/local profiles. Set this
    # explicitly when you want reproducible small-model behavior.
    execution_mode: compact
    initial_context_tokens: 8192
    max_agent_steps: 32
    no_progress_limit: 3
    staged_retrieval: true
  local-coder:
    provider: local
    model: local-coder
    local: true
    coding_score: 8
    execution_mode: compact
routing:
  architect: strong-cloud
  planner: strong-cloud
  builder: local-ollama
  reviewer: local-coder
  debugger: strong-cloud
  tester: local-coder
  summarizer: local-coder
  deployer: local-coder
routing_fallbacks:
  builder: [strong-cloud]
tui:
  theme: dark
  display_mode: standard
  submit_shortcut: enter
  show_hints: true
  streaming: true
  keybindings: {}
deployment:
  targets:
    production:
      type: ssh
      host: example.com
      username: deployer
      auth:
        key_path: ~/.ssh/id_ed25519
      deployment_path: /opt/apps/example
      environment: production
      health_url: https://example.com/health
