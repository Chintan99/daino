name: sizing
description: >
  Pins the thresholds in daino/context/profiles.py that decide whether a task
  fits a model. These are arithmetic derived from a model's window, and the
  numbers they produce are what the splitter acts on — so a change that quietly
  halves the headroom should fail here rather than show up as a stalled run.

cases:
  - id: a-small-local-model-runs-compact
    kind: sizing
    description: An 8k window cannot hold a full transcript plus scaffolding.
    tags: [compact]
    profile:
      provider: local
      model: qwen2.5-coder-7b
      local: true
      context_window: 8192
      coding_score: 4
      tool_reliability: 4
    sizing:
      compact: true
      max_max_files_per_task: 3

  - id: a-large-cloud-model-does-not
    kind: sizing
    description: A 200k window has room to work normally.
    tags: [standard]
    profile:
      provider: cloud
      model: big-coder
      context_window: 200000
      max_output_tokens: 32000
      coding_score: 9
      tool_reliability: 9
      structured_reliability: 9
    sizing:
      compact: false
      one_action_per_turn: false
      min_working_headroom_tokens: 100000

  - id: the-project-budget-caps-a-large-window-not-the-window
    kind: sizing
    description: >
      A 200k model with the default 24k project context budget plans three files
      per task, not thirty. The bound is project.context_budget_tokens, and this
      case exists because that is the opposite of what the window suggests —
      anyone reading "200k" and expecting a wide task packet is reading the wrong
      number, and raising the window alone will not change it.
    tags: [standard, invariant]
    profile:
      provider: cloud
      model: big-coder
      context_window: 200000
      coding_score: 9
      tool_reliability: 9
      project_budget_tokens: 24000
    sizing:
      min_max_files_per_task: 3
      max_max_files_per_task: 3

  - id: raising-the-project-budget-is-what-widens-a-task
    kind: sizing
    description: The same model, given a larger project budget, plans more files.
    tags: [standard]
    profile:
      provider: cloud
      model: big-coder
      context_window: 200000
      coding_score: 9
      tool_reliability: 9
      project_budget_tokens: 80000
    sizing:
      min_max_files_per_task: 6

  - id: the-source-budget-never-exceeds-the-headroom
    kind: sizing
    description: >
      A task whose files fit the bundle but not the working headroom is the
      thrash case: the read succeeds, compaction sheds it, the agent reads again.
      task_source_budget_tokens exists to prevent exactly that, so it must stay
      at or below the headroom for every profile shape.
    tags: [invariant]
    profile:
      provider: cloud
      model: mid
      context_window: 32768
      coding_score: 6
      tool_reliability: 6
    sizing:
      min_task_source_budget_tokens: 1
      max_task_source_budget_tokens: 32768
